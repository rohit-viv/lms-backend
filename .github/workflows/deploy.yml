name: LMS Backend CI-CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: lms-backend-production
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build NestJS application
        run: npm run build

  deploy:
    name: Deploy to EC2 through SSM
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Get temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::195944754892:role/LmsGitHubActionsRole
          aws-region: ap-south-1
          role-session-name: github-actions-lms-backend

      - name: Deploy backend
        shell: bash
        run: |
          set -euo pipefail

          DEPLOY_COMMAND="cd /home/ubuntu/lms-backend && git pull --ff-only origin main && npm ci --no-audit --no-fund && npm run build && pm2 restart lms-backend --update-env && pm2 save"

          PARAMETERS=$(jq -n \
            --arg command "sudo -iu ubuntu bash -lc '$DEPLOY_COMMAND'" \
            '{commands: [$command]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-0394d9deb191da7df" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMETERS" \
            --comment "Deploy LMS backend from GitHub Actions" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          set +e
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-0394d9deb191da7df"
          WAIT_RESULT=$?
          set -e

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-0394d9deb191da7df" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json

          if [ "$WAIT_RESULT" -ne 0 ]; then
            echo "Deployment failed"
            exit 1
          fi
